env:
  - ADMIN_APP_URL=
  - ADMIN_APP_PATH=admin

providers:
  - Workbench\App\Providers\WorkbenchServiceProvider
  - BrunosCode\TwillTranslationHandler\TwillTranslationHandlerServiceProvider

migrations:
  - workbench/database/migrations
  - src/Twill/Capsules/Translations/database/migrations

workbench:
  start: '/'
  install: true
  discovers:
    web: true
    api: false
    commands: false
    components: false
    views: false
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh:
        --seed: true
        --seeder: Workbench\Database\Seeders\DatabaseSeeder
  assets:
    - laravel-assets
  sync:
    - from: config/translation-handler.php
      to: config/translation-handler.php
